name: Main promotion

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  main-promotion:
    name: main-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Allow only development or a hotfix into main
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.head_ref }}
          SOURCE: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          allowed=0
          if [ -n "$SOURCE" ] && [ "$SOURCE" = "$TARGET" ]; then
            case "$HEAD" in
              development|hotfix|hotfix/*|hotfix-*) allowed=1 ;;
            esac
          fi
          if [ "$allowed" -eq 1 ]; then
            echo "Allowed: $SOURCE $HEAD -> main"
            exit 0
          fi
          echo "Refusing $SOURCE $HEAD -> main"
          gh pr close "$PR" --repo "$TARGET" --comment "$(cat <<EOF
          main only accepts pull requests from \`development\` or a \`hotfix/*\` branch in this repository.

          This pull request is from \`$HEAD\` (\`$SOURCE\`). Open it against development, or use a \`hotfix/*\` branch for a production fix.
          EOF
          )"
          exit 1
